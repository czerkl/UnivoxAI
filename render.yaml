services:
  - type: worker
    name: univox-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PORT
        value: 10000
      - key: BOT_TOKEN
        sync: false # Будет запрошен при деплое
      - key: GEMINI_API_KEY
        sync: false # Будет запрошен при деплое
        